version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-patch-and-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
